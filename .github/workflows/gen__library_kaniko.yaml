jobs:
  build:
    env: {}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: shanduur-auto
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - run: |-
          docker \
              buildx \
              build \
              --load \
              --label=org.opencontainers.image.authors='anza-labs contributors' \
              --label=org.opencontainers.image.created='${{ github.event.created_at }}' \
              --label=org.opencontainers.image.revision='${{ github.sha }}' \
              --label=org.opencontainers.image.source='https://github.com/anza-labs/docker-library' \
              --label=org.opencontainers.image.url='${{ github.event.repository.html_url }}' \
              --label=org.opencontainers.image.vendor='anza-labs' \
              --target=${{ matrix.target }} \
              --build-arg=VERSION=${{ matrix.version }} \
              --build-arg=BASE_IMAGE=gcr.io/distroless/static:latest@sha256:47b2d72ff90843eb8a768b5c2f89b40741843b639d065b9b937b07cd59b479c6 \
              --platform=linux/${{ matrix.arch }} \
              --file=library/kaniko/Dockerfile \
              --tag=ghcr.io/anza-labs/library/kaniko/${{ matrix.target }}:${{ matrix.version }}-${{ matrix.arch }} \
              library/kaniko
      - run: |-
          docker \
              push \
              ghcr.io/anza-labs/library/kaniko/${{ matrix.target }}:${{ matrix.version }}-${{ matrix.arch }}
      - run: curl -sL "https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_$(uname -s)_$(uname -m).tar.gz" | tar xz -C /usr/local/bin crane
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      - if: ${{ matrix.version != 'latest' }}
        run: |-
          cosign \
              sign \
              --yes \
              ghcr.io/anza-labs/library/kaniko/${{ matrix.target }}@$(crane digest ghcr.io/anza-labs/library/kaniko/${{ matrix.target }}:${{ matrix.version }}-${{ matrix.arch }})
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        target:
          - executor
          - executor-debug
          - warmer
        version:
          - v1.25.23
  promote:
    env: {}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: shanduur-auto
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - run: |-
          docker \
              manifest \
              create \
              --amend \
              ghcr.io/anza-labs/library/kaniko/${{ matrix.target }}:${{ matrix.version }} \
              ghcr.io/anza-labs/library/kaniko/${{ matrix.target }}:${{ matrix.version }}-amd64 \
              ghcr.io/anza-labs/library/kaniko/${{ matrix.target }}:${{ matrix.version }}-arm64
      - run: |-
          docker \
              manifest \
              annotate \
              --arch=amd64 \
              ghcr.io/anza-labs/library/kaniko/${{ matrix.target }}:${{ matrix.version }} \
              ghcr.io/anza-labs/library/kaniko/${{ matrix.target }}:${{ matrix.version }}-amd64 && \
          docker \
              manifest \
              annotate \
              --arch=arm64 \
              ghcr.io/anza-labs/library/kaniko/${{ matrix.target }}:${{ matrix.version }} \
              ghcr.io/anza-labs/library/kaniko/${{ matrix.target }}:${{ matrix.version }}-arm64
      - run: |-
          docker \
              manifest \
              push \
              ghcr.io/anza-labs/library/kaniko/${{ matrix.target }}:${{ matrix.version }}
      - run: curl -sL "https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_$(uname -s)_$(uname -m).tar.gz" | tar xz -C /usr/local/bin crane
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      - if: ${{ matrix.version != 'latest' }}
        run: |-
          cosign \
              sign \
              --yes \
              ghcr.io/anza-labs/library/kaniko/${{ matrix.target }}@$(crane digest ghcr.io/anza-labs/library/kaniko/${{ matrix.target }}:${{ matrix.version }})
    strategy:
      matrix:
        target:
          - executor
          - executor-debug
          - warmer
        version:
          - v1.25.23
name: release library/kaniko
"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/gen__library_kaniko.yaml
      - library/kaniko/Dockerfile
      - library/kaniko/pkg.toml
  workflow_dispatch: {}
permissions:
  contents: write
  id-token: write
  packages: write
